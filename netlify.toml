# Netlify configuration file for Sri Vaikundam Men's PG

[build]
  # Build command
  command = "npm run build"
  # Output directory where Vite creates production assets
  publish = "dist"

# Single Page Application (SPA) redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional caching & security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
